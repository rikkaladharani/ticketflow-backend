
spring.application.name=ticketflow-backend
server.port=${PORT:8080}

ticketflow.jwt.secret=${TICKETFLOW_JWT_SECRET}
ticketflow.jwt.expiration-ms=86400000

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketflow?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Frontend development origin
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5174
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
